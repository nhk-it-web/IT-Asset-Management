<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Asset Management System</title>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 2rem 1rem; box-sizing: border-box;">

<div style="max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem;">

    <div style="text-align: center; border-bottom: 1px solid #1e293b; padding-bottom: 1.5rem;">
        <h1 style="font-size: 2.5rem; font-weight: 800; margin: 0; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;">IT Asset Management</h1>
    </div>

    <!-- Stats -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); background-color: #1e293b; padding: 1.25rem; border-radius: 0.75rem; border: 1px solid #334155; text-align: center;">
        <div><span style="font-size: 0.75rem; color: #94a3b8;">Total Assets</span><span style="display: block; font-size: 2rem; font-weight: 800; color: #fff;" id="statTotal">0</span></div>
        <div style="border-left: 1px solid #334155; border-right: 1px solid #334155;"><span style="font-size: 0.75rem; color: #94a3b8;">Operational</span><span style="display: block; font-size: 2rem; font-weight: 800; color: #34d399;" id="statOperational">100%</span></div>
        <div><span style="font-size: 0.75rem; color: #94a3b8;">Maintenance</span><span style="display: block; font-size: 2rem; font-weight: 800; color: #fbbf24;" id="statInService">0</span></div>
    </div>

    <!-- Register -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
        <div style="background-color: #1e293b; border: 1px solid #334155; padding: 1.25rem; border-radius: 0.75rem;">
            <label style="font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 0.75rem; color: #38bdf8;">Select Preset Asset Type</label>
            <select id="presetTypeDropdown" style="width: 100%; padding: 0.75rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; font-size: 0.875rem; outline: none; cursor: pointer;"></select>
        </div>
        <div style="background-color: #1e293b; border: 1px solid #334155; padding: 1.25rem; border-radius: 0.75rem;">
            <label style="font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 0.75rem; color: #c084fc;">Add New Asset Type</label>
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <input id="customTypeInput" type="text" placeholder="e.g. Projector" style="width: 100%; box-sizing: border-box; padding: 0.75rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; font-size: 0.875rem; outline: none;">
                <button id="addTypeBtn" style="background-color: #9333ea; color: white; padding: 0.75rem; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer;">Add Type</button>
            </div>
        </div>
    </div>

    <!-- Configuration panel (appears after selecting a type) -->
    <div id="configPanel" style="display: none; background-color: #1e293b; border: 1px solid #38bdf8; padding: 1.25rem; border-radius: 0.75rem;">
        <h2 id="configTitle" style="margin: 0 0 0.75rem; font-size: 1.1rem; color: #38bdf8;">Configuration</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem; margin-bottom: 1rem;">
            <div><label class="lbl">Asset Name</label><input id="assetName" type="text" placeholder="e.g. Dell Latitude 01" class="fld"></div>
            <div><label class="lbl">Assigned To (Person)</label><input id="assetHolder" type="text" placeholder="e.g. Rahim" class="fld"></div>
            <div><label class="lbl">Department</label><input id="assetDept" type="text" list="deptList" placeholder="e.g. Accounts" class="fld"></div>
            <div><label class="lbl">Assigned Date</label><input id="assetDate" type="date" class="fld"></div>
            <datalist id="deptList"></datalist>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <span style="font-size: 0.85rem; color: #94a3b8;">Details</span>
            <button id="addFieldBtn" style="background: #334155; color: #fff; border: none; border-radius: 0.4rem; padding: 0.45rem 0.8rem; cursor: pointer; font-size: 0.8rem;">+ Add Field</button>
        </div>
        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.875rem;">
                <thead><tr style="text-align: left; color: #94a3b8; border-bottom: 1px solid #334155;">
                    <th style="padding: 0.6rem 0.5rem; width: 35%;">Field</th><th style="padding: 0.6rem 0.5rem;">Value</th><th style="width: 40px;"></th>
                </tr></thead>
                <tbody id="configBody"></tbody>
            </table>
        </div>
        <button id="registerBtn" style="margin-top: 1rem; width: 100%; background-color: #2563eb; color: white; padding: 0.75rem; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer;">Register Asset</button>
    </div>

    <!-- Filters -->
    <div style="background-color: #1e293b; border: 1px solid #334155; padding: 1rem 1.25rem; border-radius: 0.75rem; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;">
        <input id="filterName" type="text" placeholder="Filter by Name / Person..." class="fld" style="flex: 1; min-width: 180px;">
        <select id="filterDept" class="fld" style="flex: 1; min-width: 180px; cursor: pointer;"></select>
        <button id="expandAll" style="background: #334155; color: #fff; border: none; border-radius: 0.4rem; padding: 0.65rem 0.9rem; cursor: pointer; font-size: 0.8rem;">Expand all</button>
        <button id="collapseAll" style="background: #334155; color: #fff; border: none; border-radius: 0.4rem; padding: 0.65rem 0.9rem; cursor: pointer; font-size: 0.8rem;">Collapse all</button>
    </div>

    <!-- Type options: click to open the hidden table -->
    <div id="typeList" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
</div>

<!-- Modal for Transfer and History -->
<div id="modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 50; align-items: center; justify-content: center; padding: 1rem; box-sizing: border-box;">
    <div id="modalBody" style="background: #1e293b; border: 1px solid #38bdf8; border-radius: 0.75rem; padding: 1.25rem; width: 100%; max-width: 760px; max-height: 88vh; overflow: auto; box-sizing: border-box;"></div>
</div>

<style>
    .fld { box-sizing: border-box; padding: 0.65rem; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; font-size: 0.85rem; outline: none; width: 100%; color-scheme: dark; }
    .fld:focus { border-color: #38bdf8; }
    .lbl { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.3rem; }
</style>

<script>
    var presetFields = {
        'Laptop':     ['Brand', 'Model', 'CPU', 'RAM', 'Storage', 'Serial No.'],
        'Desktop PC': ['Brand', 'Model', 'CPU', 'RAM', 'Storage', 'Serial No.'],
        'Monitor':    ['Brand', 'Model', 'Size', 'Resolution', 'Serial No.'],
        'Printer':    ['Brand', 'Model', 'Type (Laser/Inkjet)', 'IP Address', 'Serial No.'],
        'Router':     ['Brand', 'Model', 'IP Address', 'MAC Address', 'Firmware', 'Location'],
        'Server':     ['Brand', 'Model', 'CPU', 'RAM', 'Storage', 'OS', 'IP Address', 'Location'],
        'Smartphone': ['Brand', 'Model', 'OS', 'Storage', 'IMEI'],
        'Keyboard':   ['Brand', 'Model', 'Connection (USB/Wireless)']
    };
    var defaultFields = ['Brand', 'Model', 'Serial No.'];

    var types = Object.keys(presetFields);
    var assets = [];
    var nextId = 1;
    var openTypes = {};
    var cfgRows = [];
    var modalState = null;

    var $ = function (id) { return document.getElementById(id); };
    var dropdown = $('presetTypeDropdown');

    /* ---------- Dates ---------- */
    function pad(n) { return String(n).padStart(2, '0'); }
    function today() {
        var d = new Date();
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }
    function toUtc(s) {
        var p = s.split('-');
        return Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }
    function daysBetween(a, b) { return Math.round((toUtc(b) - toUtc(a)) / 86400000); }
    function fmt(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
    function dLabel(n) { return n + (n === 1 ? ' day' : ' days'); }

    /* ---------- Save / load (this browser only) ---------- */
    function save() {
        try { localStorage.setItem('itAssetsV3', JSON.stringify({ types: types, assets: assets, nextId: nextId })); } catch (e) {}
    }
    function load() {
        try {
            var d = JSON.parse(localStorage.getItem('itAssetsV3') || localStorage.getItem('itAssetsV2'));
            if (d) { types = d.types || types; assets = d.assets || []; nextId = d.nextId || 1; }
        } catch (e) {}
        // Older entries (without history) get a starting history record
        assets.forEach(function (a) {
            if (!a.history) {
                a.holder = a.holder || 'Unassigned';
                a.history = [{ holder: a.holder, dept: a.dept, from: today(), to: null, note: 'Initial assignment' }];
            }
        });
    }

    function esc(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }
    function attr(s) { return esc(s).replace(/"/g, '&quot;'); }
    function findAsset(id) { return assets.filter(function (a) { return a.id === id; })[0]; }
    function curEntry(a) { return a.history[a.history.length - 1]; }

    /* ---------- Dropdown + config panel ---------- */
    function renderDropdown(selected) {
        dropdown.innerHTML = '<option value="">-- Select asset type --</option>' +
            types.map(function (t) { return '<option value="' + attr(t) + '">' + esc(t) + '</option>'; }).join('');
        dropdown.value = selected || '';
    }

    function loadConfigFor(type) {
        if (!type) { $('configPanel').style.display = 'none'; cfgRows = []; return; }
        cfgRows = (presetFields[type] || defaultFields).map(function (f) { return { k: f, v: '' }; });
        $('configTitle').textContent = 'Configuration - ' + type;
        $('assetDate').value = today();
        $('assetDate').max = today();
        renderConfig();
        $('configPanel').style.display = 'block';
    }

    function renderConfig() {
        $('configBody').innerHTML = cfgRows.map(function (r, i) {
            return '<tr style="border-bottom:1px solid #334155;">' +
                '<td style="padding:0.4rem 0.5rem;"><input class="fld" data-i="' + i + '" data-p="k" value="' + attr(r.k) + '"></td>' +
                '<td style="padding:0.4rem 0.5rem;"><input class="fld" data-i="' + i + '" data-p="v" value="' + attr(r.v) + '" placeholder="Write value..."></td>' +
                '<td style="text-align:center;"><button data-rm="' + i + '" style="background:none; border:none; color:#f87171; font-size:1.1rem; cursor:pointer;">&times;</button></td></tr>';
        }).join('');
    }

    $('configBody').addEventListener('input', function (e) {
        if (e.target.dataset.i !== undefined) cfgRows[e.target.dataset.i][e.target.dataset.p] = e.target.value;
    });
    $('configBody').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-rm]');
        if (!b) return;
        cfgRows.splice(Number(b.dataset.rm), 1);
        renderConfig();
    });
    $('addFieldBtn').addEventListener('click', function () {
        cfgRows.push({ k: '', v: '' });
        renderConfig();
        var l = $('configBody').querySelectorAll('input[data-p="k"]');
        l[l.length - 1].focus();
    });
    dropdown.addEventListener('change', function () { loadConfigFor(dropdown.value); });

    function addCustomType() {
        var name = $('customTypeInput').value.trim();
        if (!name) return;
        var m = types.filter(function (t) { return t.toLowerCase() === name.toLowerCase(); })[0];
        if (!m) { types.push(name); m = name; save(); }
        renderDropdown(m);
        loadConfigFor(m);
        renderList();
        $('customTypeInput').value = '';
    }
    $('addTypeBtn').addEventListener('click', addCustomType);
    $('customTypeInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') addCustomType(); });

    /* ---------- Register ---------- */
    $('registerBtn').addEventListener('click', function () {
        var type = dropdown.value;
        var name = $('assetName').value.trim();
        if (!type) return;
        if (!name) { alert('অ্যাসেটের Name লিখুন।'); $('assetName').focus(); return; }
        var holder = $('assetHolder').value.trim() || 'Unassigned';
        var dept = $('assetDept').value.trim() || 'Unassigned';
        var from = $('assetDate').value || today();
        assets.push({
            id: nextId++, type: type, name: name, holder: holder, dept: dept,
            status: 'Operational',
            config: cfgRows.filter(function (r) { return r.k.trim() && r.v.trim(); })
                           .map(function (r) { return { k: r.k.trim(), v: r.v.trim() }; }),
            history: [{ holder: holder, dept: dept, from: from, to: null, note: 'Initial assignment' }]
        });
        openTypes[type] = true;
        $('assetName').value = '';
        $('assetHolder').value = '';
        $('assetDept').value = '';
        renderDropdown('');
        loadConfigFor('');
        save();
        renderAll();
    });

    /* ---------- Filters ---------- */
    function renderDeptFilter() {
        var cur = $('filterDept').value;
        var depts = [];
        assets.forEach(function (a) { if (depts.indexOf(a.dept) === -1) depts.push(a.dept); });
        depts.sort();
        $('filterDept').innerHTML = '<option value="">All Departments</option>' +
            depts.map(function (d) { return '<option value="' + attr(d) + '">' + esc(d) + '</option>'; }).join('');
        $('filterDept').value = depts.indexOf(cur) > -1 ? cur : '';
        $('deptList').innerHTML = depts.map(function (d) { return '<option value="' + attr(d) + '">'; }).join('');
    }

    $('filterName').addEventListener('input', renderList);
    $('filterDept').addEventListener('change', renderList);
    $('expandAll').addEventListener('click', function () { types.forEach(function (t) { openTypes[t] = true; }); renderList(); });
    $('collapseAll').addEventListener('click', function () { openTypes = {}; renderList(); });

    /* ---------- Type list (accordion of hidden tables) ---------- */
    function renderList() {
        var q = $('filterName').value.trim().toLowerCase();
        var dept = $('filterDept').value;
        $('typeList').innerHTML = types.map(function (t, ti) {
            var list = assets.filter(function (a) {
                return a.type === t &&
                    (!q || a.name.toLowerCase().indexOf(q) > -1 || a.holder.toLowerCase().indexOf(q) > -1) &&
                    (!dept || a.dept === dept);
            });
            var open = !!openTypes[t];
            var head =
                '<button data-toggle="' + ti + '" style="width:100%; display:flex; justify-content:space-between; align-items:center; background:#1e293b; border:1px solid ' + (open ? '#38bdf8' : '#334155') + '; color:#e2e8f0; padding:0.95rem 1.1rem; border-radius:' + (open ? '0.75rem 0.75rem 0 0' : '0.75rem') + '; font-size:1rem; font-weight:600; cursor:pointer;">' +
                '<span>' + esc(t) + ' <span style="margin-left:0.5rem; font-size:0.75rem; font-weight:700; padding:0.15rem 0.55rem; border-radius:999px; background:#0f172a; color:#38bdf8;">' + list.length + '</span></span>' +
                '<span style="color:#94a3b8;">' + (open ? '&#9662;' : '&#9656;') + '</span></button>';
            if (!open) return '<div>' + head + '</div>';
            var rows = list.length ? list.map(rowHtml).join('') :
                '<tr><td colspan="7" style="padding:1.2rem; text-align:center; color:#64748b;">No assets found.</td></tr>';
            return '<div>' + head +
                '<div style="background:#1e293b; border:1px solid #38bdf8; border-top:none; border-radius:0 0 0.75rem 0.75rem; overflow-x:auto;">' +
                '<table style="width:100%; border-collapse:collapse; font-size:0.875rem;"><thead><tr style="text-align:left; color:#94a3b8; border-bottom:1px solid #334155;">' +
                '<th style="padding:0.8rem 1rem;">ID</th><th style="padding:0.8rem 1rem;">Name</th><th style="padding:0.8rem 1rem;">Assigned To</th><th style="padding:0.8rem 1rem;">Department</th><th style="padding:0.8rem 1rem;">Configuration</th><th style="padding:0.8rem 1rem;">Status</th><th style="padding:0.8rem 1rem; text-align:right;">Actions</th></tr></thead>' +
                '<tbody>' + rows + '</tbody></table></div></div>';
        }).join('');
    }

    function rowHtml(a) {
        var maint = a.status === 'Maintenance';
        var cur = curEntry(a);
        var used = daysBetween(cur.from, today());
        var cfg = a.config.length ? a.config.map(function (c) {
            return '<div style="font-size:0.78rem; line-height:1.5;"><span style="color:#94a3b8;">' + esc(c.k) + ':</span> ' + esc(c.v) + '</div>';
        }).join('') : '<span style="color:#64748b;">-</span>';
        var btn = 'border:none; border-radius:0.4rem; padding:0.4rem 0.7rem; cursor:pointer; margin-left:0.3rem; color:#fff;';
        return '<tr style="border-bottom:1px solid #334155; vertical-align:top;">' +
            '<td style="padding:0.8rem 1rem; color:#94a3b8;">AST-' + String(a.id).padStart(3, '0') + '</td>' +
            '<td style="padding:0.8rem 1rem; font-weight:600;">' + esc(a.name) + '</td>' +
            '<td style="padding:0.8rem 1rem;"><div style="font-weight:600;">' + esc(a.holder) + '</div>' +
                '<div style="font-size:0.75rem; color:#94a3b8;">since ' + fmt(cur.from) + ' (' + dLabel(used) + ')</div></td>' +
            '<td style="padding:0.8rem 1rem;">' + esc(a.dept) + '</td>' +
            '<td style="padding:0.8rem 1rem;">' + cfg + '</td>' +
            '<td style="padding:0.8rem 1rem;"><span style="padding:0.25rem 0.6rem; border-radius:999px; font-size:0.75rem; font-weight:600; background:' +
                (maint ? 'rgba(251,191,36,0.15); color:#fbbf24;' : 'rgba(52,211,153,0.15); color:#34d399;') + '">' + a.status + '</span></td>' +
            '<td style="padding:0.8rem 1rem; text-align:right; white-space:nowrap;">' +
                '<button data-act="transfer" data-id="' + a.id + '" style="background:#2563eb; ' + btn + '">Transfer</button>' +
                '<button data-act="history" data-id="' + a.id + '" style="background:#7c3aed; ' + btn + '">History (' + a.history.length + ')</button>' +
                '<button data-act="status" data-id="' + a.id + '" style="background:#334155; ' + btn + '">' + (maint ? 'Mark Operational' : 'Maintenance') + '</button>' +
                '<button data-act="del" data-id="' + a.id + '" style="background:#7f1d1d; ' + btn + '">Delete</button></td></tr>';
    }

    $('typeList').addEventListener('click', function (e) {
        var t = e.target.closest('button[data-toggle]');
        if (t) {
            var name = types[Number(t.dataset.toggle)];
            openTypes[name] = !openTypes[name];
            renderList();
            return;
        }
        var b = e.target.closest('button[data-act]');
        if (!b) return;
        var id = Number(b.dataset.id);
        var act = b.dataset.act;
        if (act === 'transfer') return openTransfer(id);
        if (act === 'history') return openHistory(id);
        if (act === 'del') {
            if (!confirm('এই অ্যাসেটটা মুছে ফেলবেন? এর হিস্ট্রিও মুছে যাবে।')) return;
            assets = assets.filter(function (a) { return a.id !== id; });
        } else {
            assets.forEach(function (a) { if (a.id === id) a.status = a.status === 'Operational' ? 'Maintenance' : 'Operational'; });
        }
        save();
        renderAll();
    });

    /* ---------- Modal: Transfer ---------- */
    function showModal(html) { $('modalBody').innerHTML = html; $('modal').style.display = 'flex'; }
    function closeModal() { $('modal').style.display = 'none'; modalState = null; }

    function openTransfer(id) {
        var a = findAsset(id);
        var cur = curEntry(a);
        var t = today();
        modalState = { id: id };
        showModal(
            '<h3 style="margin:0 0 0.4rem; color:#38bdf8;">Transfer - ' + esc(a.name) + '</h3>' +
            '<p style="margin:0 0 1rem; font-size:0.85rem; color:#94a3b8;">Currently with <b style="color:#e2e8f0;">' + esc(a.holder) + '</b> (' + esc(a.dept) + ') since ' + fmt(cur.from) + ' - ' + dLabel(daysBetween(cur.from, t)) + '</p>' +
            '<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:0.75rem;">' +
                '<div><label class="lbl">Transfer To (Person)</label><input id="tfHolder" class="fld" type="text" placeholder="e.g. Karim"></div>' +
                '<div><label class="lbl">Department</label><input id="tfDept" class="fld" type="text" list="deptList" value="' + attr(a.dept) + '"></div>' +
                '<div><label class="lbl">Transfer Date</label><input id="tfDate" class="fld" type="date" min="' + cur.from + '" max="' + t + '" value="' + (t < cur.from ? cur.from : t) + '"></div>' +
                '<div><label class="lbl">Note (optional)</label><input id="tfNote" class="fld" type="text" placeholder="e.g. Role change"></div>' +
            '</div>' +
            '<div style="display:flex; gap:0.6rem; margin-top:1.1rem;">' +
                '<button id="tfConfirm" style="flex:1; background:#2563eb; color:#fff; border:none; border-radius:0.5rem; padding:0.75rem; font-weight:600; cursor:pointer;">Confirm Transfer</button>' +
                '<button data-close="1" style="background:#334155; color:#fff; border:none; border-radius:0.5rem; padding:0.75rem 1.2rem; cursor:pointer;">Cancel</button>' +
            '</div>'
        );
        $('tfHolder').focus();
    }

    function doTransfer() {
        if (!modalState) return;
        var a = findAsset(modalState.id);
        var cur = curEntry(a);
        var holder = $('tfHolder').value.trim();
        var dept = $('tfDept').value.trim() || 'Unassigned';
        var date = $('tfDate').value;
        var note = $('tfNote').value.trim();
        if (!holder) { alert('কার কাছে ট্রান্সফার করবেন তার নাম লিখুন।'); return; }
        if (!date) { alert('ট্রান্সফারের তারিখ দিন।'); return; }
        if (date < cur.from) { alert('ট্রান্সফারের তারিখ আগের এসাইন তারিখ (' + fmt(cur.from) + ') এর আগে হতে পারবে না।'); return; }
        if (date > today()) { alert('ভবিষ্যতের তারিখ দেওয়া যাবে না।'); return; }
        if (holder.toLowerCase() === a.holder.toLowerCase() && dept.toLowerCase() === a.dept.toLowerCase()) {
            alert('এই অ্যাসেট আগে থেকেই এই ব্যক্তির কাছে আছে।'); return;
        }
        cur.to = date;
        a.history.push({ holder: holder, dept: dept, from: date, to: null, note: note });
        a.holder = holder;
        a.dept = dept;
        openTypes[a.type] = true;
        save();
        closeModal();
        renderAll();
    }

    /* ---------- Modal: History ---------- */
    function openHistory(id) {
        var a = findAsset(id);
        var t = today();
        var total = 0;
        var rows = a.history.map(function (h, i) {
            var end = h.to || t;
            var days = daysBetween(h.from, end);
            total += days;
            var isCur = !h.to;
            return '<tr style="border-bottom:1px solid #334155;' + (isCur ? ' background:rgba(52,211,153,0.07);' : '') + '">' +
                '<td style="padding:0.65rem 0.7rem; color:#94a3b8;">' + (i + 1) + '</td>' +
                '<td style="padding:0.65rem 0.7rem; font-weight:600;">' + esc(h.holder) + '</td>' +
                '<td style="padding:0.65rem 0.7rem;">' + esc(h.dept) + '</td>' +
                '<td style="padding:0.65rem 0.7rem;">' + fmt(h.from) + '</td>' +
                '<td style="padding:0.65rem 0.7rem;">' + (isCur ? '<span style="color:#34d399; font-weight:600;">Present</span>' : fmt(h.to)) + '</td>' +
                '<td style="padding:0.65rem 0.7rem; font-weight:600;">' + dLabel(days) + (isCur ? ' <span style="color:#94a3b8; font-weight:400;">(so far)</span>' : '') + '</td>' +
                '<td style="padding:0.65rem 0.7rem; color:#94a3b8;">' + (h.note ? esc(h.note) : '-') + '</td></tr>';
        }).join('');
        showModal(
            '<h3 style="margin:0 0 0.3rem; color:#38bdf8;">History - ' + esc(a.name) + ' (AST-' + String(a.id).padStart(3, '0') + ')</h3>' +
            '<p style="margin:0 0 1rem; font-size:0.85rem; color:#94a3b8;">Total in use: <b style="color:#e2e8f0;">' + dLabel(total) + '</b> &middot; ' + a.history.length + ' record(s)</p>' +
            '<div style="overflow-x:auto;"><table style="width:100%; border-collapse:collapse; font-size:0.85rem;">' +
            '<thead><tr style="text-align:left; color:#94a3b8; border-bottom:1px solid #334155;">' +
            '<th style="padding:0.6rem 0.7rem;">#</th><th style="padding:0.6rem 0.7rem;">Person</th><th style="padding:0.6rem 0.7rem;">Department</th><th style="padding:0.6rem 0.7rem;">From</th><th style="padding:0.6rem 0.7rem;">To</th><th style="padding:0.6rem 0.7rem;">Days Used</th><th style="padding:0.6rem 0.7rem;">Note</th></tr></thead>' +
            '<tbody>' + rows + '</tbody></table></div>' +
            '<button data-close="1" style="margin-top:1.1rem; width:100%; background:#334155; color:#fff; border:none; border-radius:0.5rem; padding:0.75rem; cursor:pointer;">Close</button>'
        );
    }

    $('modal').addEventListener('click', function (e) {
        if (e.target === $('modal') || e.target.closest('[data-close]')) return closeModal();
        if (e.target.id === 'tfConfirm') doTransfer();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

    /* ---------- Stats ---------- */
    function updateStats() {
        var total = assets.length;
        var maint = assets.filter(function (a) { return a.status === 'Maintenance'; }).length;
        $('statTotal').textContent = total;
        $('statOperational').textContent = (total === 0 ? 100 : Math.round(((total - maint) / total) * 100)) + '%';
        $('statInService').textContent = maint;
    }

    function renderAll() {
        renderDeptFilter();
        renderList();
        updateStats();
    }

    load();
    renderDropdown('');
    renderAll();
</script>
</body>
</html>
