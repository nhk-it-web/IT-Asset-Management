  <div class="company-dashboard-row">
    <div class="card company-card">
      <label class="lbl" style="font-size:.9rem;font-weight:600;color:#38bdf8">Select Preset Asset Type</label>
      <div class="toolbar-select">
        <select id="preset" class="fld" style="cursor:pointer"></select>
        <button id="delType" class="btn b-red" type="button">Delete</button>
      </div>
    </div>
    <div id="chart" class="chart-dashboard" aria-label="Asset status chart"></div>

      <label class="lbl" style="font-size:.9rem;font-weight:600;color:#c084fc">Add New Asset Type</label>
      <div style="display:flex;gap:.45rem"><input id="newType" class="fld" placeholder="e.g. Projector"><button id="addType" class="btn b-pur" style="padding:.6rem .8rem">Add</button></div>
    </div>
  </div>
