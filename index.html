<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Management Suite - Premium Dark Theme</title>
    <!-- Tailwind CSS for Exact UI Reproduction -->
    <script src="https://jsdelivr.net"></script>
    <style>
        @import url('https://googleapis.com');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #1a1d24;
        }
        .dark-card {
            background-color: #22262f;
            border: 1px solid #2d323f;
        }
        .dark-input {
            background-color: #2d323f;
            border: 1px solid #373e4f;
            color: #ffffff;
        }
        .dark-input:focus {
            border-color: #3b82f6;
            outline: none;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Top Stats Counter Row -->
        <div class="grid grid-cols-3 gap-1 bg-[#16191f] p-4 rounded-xl border border-[#232731] text-center">
            <div>
                <span class="text-xs text-slate-400 block font-medium">Total Items</span>
                <span class="text-2xl font-bold text-white mt-1 block" id="statTotal">5</span>
            </div>
            <div class="border-x border-[#2d323f]">
                <span class="text-xs text-slate-400 block font-medium">Operational</span>
                <span class="text-2xl font-bold text-emerald-500 mt-1 block" id="statOperational">60%</span>
            </div>
            <div>
                <span class="text-xs text-slate-400 block font-medium">In Service</span>
                <span class="text-2xl font-bold text-amber-500 mt-1 block" id="statInService">1</span>
            </div>
        </div>

        <!-- Section: Register New Asset Type -->
        <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-300">Register new asset type</label>
            <div class="flex gap-3">
                <input id="customCategoryInput" type="text" placeholder="Router" class="flex-1 p-3 dark-input rounded-lg text-sm">
                <button onclick="addCustomCategory()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg text-sm font-semibold transition-all shadow-md active:scale-95 cursor-pointer">
                    Add Type
                </button>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
                <label class="block text-sm font-medium text-slate-300">Filter by type</label>
                <select id="filterType" onchange="renderTable()" class="w-full p-3 dark-input rounded-lg text-sm bg-[#2d323f]">
                    <option value="All">All Types</option>
                </select>
            </div>
            <div class="space-y-2">
                <label class="block text-sm font-medium text-slate-300">Filter by status</label>
                <select id="filterStatus" onchange="renderTable()" class="w-full p-3 dark-input rounded-lg text-sm bg-[#2d323f]">
                    <option value="All">All Statuses</option>
                    <option value="Available">Available</option>
                    <option value="Assigned">Assigned</option>
                    <option value="Maintenance">Maintenance</option>
                </select>
            </div>
        </div>

        <!-- Main Form Segment: Allocate & Assign New Inventory Item -->
        <div class="dark-card p-6 rounded-xl space-y-4">
            <h2 class="text-base font-semibold text-slate-200 border-b border-[#2d323f] pb-3">Allocate & Assign New Inventory Item</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Asset Name</label>
                    <input id="assetName" type="text" placeholder="e.g., ThinkPad X1 Carbon" class="w-full p-3 dark-input rounded-lg text-sm">
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Asset Type Category</label>
                    <select id="assetType" class="w-full p-3 dark-input rounded-lg text-sm bg-[#2d323f]">
                        <!-- Synced dynamically -->
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Assignee Employee</label>
                    <input id="employee" type="text" placeholder="Employee Name" class="w-full p-3 dark-input rounded-lg text-sm">
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Office Location</label>
                    <select id="officeLocation" class="w-full p-3 dark-input rounded-lg text-sm bg-[#2d323f]">
                        <option>Dhaka HQ</option>
                        <option>Chittagong Hub</option>
                        <option>Remote Working</option>
                    </select>
                </div>
            </div>

            <button onclick="addAsset()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold p-3.5 rounded-lg text-sm transition-all shadow-lg active:scale-98 mt-2 cursor-pointer">
                Commit Asset to Live Database
            </button>
        </div>

        <!-- Embedded Live Hardware Log View -->
        <div class="dark-card p-6 rounded-xl space-y-4">
            <h2 class="text-base font-semibold text-slate-200">Active Infrastructure Logs</h2>
            <div class="overflow-x-auto rounded-lg border border-[#2d323f]">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-[#16191f] text-slate-400 text-xs font-semibold uppercase border-b border-[#2d323f]">
                            <th class="p-3">Asset Profile</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Custodian</th>
                            <th class="p-3">Location</th>
                            <th class="p-3 text-center">Status</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="assetTableBody" class="divide-y divide-[#2d323f]">
                        <!-- Processed Dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Software Logic Core JavaScript -->
    <script>
        let categories = JSON.parse(localStorage.getItem('dark_categories')) || ["Laptop", "Desktop", "Tab", "Printer", "Scanner"];
        
        let assets = JSON.parse(localStorage.getItem('dark_assets')) || [
            { id: 1, name: "ThinkPad X1 Carbon", type: "Laptop", user: "Rahat", location: "Dhaka HQ", status: "Assigned" },
            { id: 2, name: "Dell OptiPlex Desktop", type: "Desktop", user: "Unassigned", location: "Dhaka HQ", status: "Available" },
            { id: 3, name: "iPad Pro M4", type: "Tab", user: "Alex", location: "Remote Working", status: "Assigned" },
            { id: 4, name: "HP LaserJet Pro", type: "Printer", user: "IT Room", location: "Dhaka HQ", status: "Maintenance" },
            { id: 5, name: "Epson V39 Scanner", type: "Scanner", user: "Unassigned", location: "Chittagong Hub", status: "Available" }
        ];

        function syncCategoryUI() {
            localStorage.setItem('dark_categories', JSON.stringify(categories));
            
            // Sync Form Dropdown
            const formSelect = document.getElementById('assetType');
            formSelect.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
            
            // Sync Filter Dropdown
            const filterSelect = document.getElementById('filterType');
            filterSelect.innerHTML = `<option value="All">All Types</option>` + categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        function addCustomCategory() {
            const input = document.getElementById('customCategoryInput');
            const newCat = input.value.trim();
            if (newCat && !categories.includes(newCat)) {
                categories.push(newCat);
                syncCategoryUI();
                input.value = '';
            }
        }

        function renderTable() {
            const body = document.getElementById('assetTableBody');
            const typeFilter = document.getElementById('filterType').value;
            const statusFilter = document.getElementById('filterStatus').value;

            const filtered = assets.filter(item => {
                const matchType = (typeFilter === "All" || item.type === typeFilter);
                const matchStatus = (statusFilter === "All" || item.status === statusFilter);
                return matchType && matchStatus;
            });

            // Dynamically calculate the Top Header Counters exactly like your snapshot
            document.getElementById('statTotal').innerText = assets.length;
            
            const operationalCount = assets.filter(a => a.status !== 'Maintenance').length;
            const operationalPercentage = assets.length > 0 ? Math.round((operationalCount / assets.length) * 100) : 0;
            document.getElementById('statOperational').innerText = `${operationalPercentage}%`;
