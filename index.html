<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Management Suite - Premium Dark Theme</title>
    <style>
        /* Pure CSS Architecture - Zero Dependencies */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1a1d24;
            color: #cbd5e1;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .space-y-6 > * + * {
            margin-top: 1.5rem;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            background-color: #16191f;
            padding: 1.25rem;
            border-radius: 0.75rem;
            border: 1px solid #2d323f;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .stat-label {
            display: block;
            font-size: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }
        .stat-value {
            display: block;
            font-size: 1.875rem;
            font-weight: 800;
            color: #ffffff;
            margin-top: 0.25rem;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #e2e8f0;
        }
        .input-sublabel {
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .flex-row {
            display: flex;
            gap: 0.75rem;
        }
        .dark-input {
            width: 100%;
            padding: 0.75rem;
            background-color: #1a1d24;
            border: 1px solid #2d323f;
            color: #ffffff;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }
        .dark-input:focus {
            border-color: #3b82f6;
            outline: none;
        }
        select.dark-input {
            background-color: #22262f;
            cursor: pointer;
        }
        .card {
            background-color: #22262f;
            border: 1px solid #2d323f;
            padding: 1.5rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #f1f5f9;
            border-b: 1px solid #2d323f;
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
        }
        .btn-blue {
            background-color: #2563eb;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-blue:hover { background-color: #1d4ed8; }
        .btn-emerald {
            width: 100%;
            background-color: #059669;
            color: white;
            padding: 0.875rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }
        .btn-emerald:hover { background-color: #047857; }
        .btn-red {
            background-color: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 0.25rem 0.5rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 0.375rem;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
        }
        .btn-red:hover { background-color: rgba(239, 68, 68, 0.2); }
        .table-container {
            overflow-x: auto;
            border: 1px solid #2d323f;
            border-radius: 0.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.875rem;
        }
        th {
            background-color: #16191f;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            padding: 1rem;
            border-bottom: 1px solid #2d323f;
        }
        td {
            padding: 1rem;
            border-bottom: 1px solid #2d323f;
            color: #e2e8f0;
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-type { background-color: #1a1d24; color: #cbd5e1; border: 1px solid #2d323f; }
        .badge-available { background-color: rgba(16, 185, 129, 0.1); color: #34d399; }
        .badge-assigned { background-color: rgba(59, 130, 246, 0.1); color: #60a5fa; }
        .badge-maintenance { background-color: rgba(245, 158, 11, 0.1); color: #fbbf24; }
    </style>
</head>
<body>

    <div class="container space-y-6">
        
        <!-- Top Stats Counter Row -->
        <div class="grid-3">
            <div>
                <span class="stat-label">Total Items</span>
                <span class="stat-value" id="statTotal">5</span>
            </div>
            <div>
                <span class="stat-label">Operational</span>
                <span class="stat-value" id="statOperational" style="color: #10b981;">100%</span>
            </div>
            <div>
                <span class="stat-label">In Service</span>
                <span class="stat-value" id="statInService" style="color: #f59e0b;">0</span>
            </div>
        </div>

        <!-- Section: Register New Asset Type -->
        <div class="form-group">
            <label class="form-label">Register new asset type</label>
            <div class="flex-row">
                <input id="customCategoryInput" type="text" placeholder="Router" class="dark-input">
                <button onclick="addCustomCategory()" class="btn-blue">Add Type</button>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="grid-2">
            <div class="form-group">
                <label class="form-label">Filter by type</label>
                <select id="filterType" onchange="renderTable()" class="dark-input">
                    <option value="All">All Types</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Filter by status</label>
                <select id="filterStatus" onchange="renderTable()" class="dark-input">
                    <option value="All">All Statuses</option>
                    <option value="Available">Available</option>
                    <option value="Assigned">Assigned</option>
                    <option value="Maintenance">Maintenance</option>
                </select>
            </div>
        </div>

        <!-- Main Form Segment: Allocate & Assign New Inventory Item -->
        <div class="card">
            <div class="card-title">Allocate & Assign New Inventory Item</div>
            
            <div class="grid-2" style="margin-bottom: 1rem;">
                <div class="form-group">
                    <label class="input-sublabel">Asset Name</label>
                    <input id="assetName" type="text" placeholder="e.g., ThinkPad X1 Carbon" class="dark-input" style="background-color: #1a1d24;">
                </div>
                <div class="form-group">
                    <label class="input-sublabel">Asset Type Category</label>
                    <select id="assetType" class="dark-input">
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label class="input-sublabel">Assignee Employee</label>
                    <input id="employee" type="text" placeholder="Employee Name" class="dark-input" style="background-color: #1a1d24;">
                </div>
                <div class="form-group">
                    <label class="input-sublabel">Office Location</label>
                    <select id="officeLocation" class="dark-input">
                        <option>Dhaka HQ</option>
                        <option>Chittagong Hub</option>
                        <option>Remote Working</option>
                    </select>
                </div>
            </div>

            <button onclick="addAsset()" class="btn-emerald">Commit Asset to Live Database</button>
        </div>

        <!-- Embedded Live Hardware Log View -->
        <div class="card">
            <div class="card-title" style="border: none; padding: 0; margin-bottom: 0.5rem;">Active Infrastructure Logs</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Asset Profile</th>
                            <th>Category</th>
                            <th>Custodian</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="assetTableBody">
