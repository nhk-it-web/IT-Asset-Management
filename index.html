<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Asset Management System</title>
</head>
<body style="font-family: system-ui, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 1.5rem; box-sizing: border-box;">

    <div style="max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem;">
        
        <!-- Header Title -->
        <div style="text-align: center; border-bottom: 1px solid #1e293b; padding-bottom: 1rem;">
            <h1 style="font-size: 2.5rem; font-weight: 800; margin: 0; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;">IT Asset Management</h1>
        </div>
        
        <!-- Counter Dashboard widgets -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); background-color: #1e293b; padding: 1rem; border-radius: 0.75rem; border: 1px solid #334155; text-align: center;">
            <div><span style="font-size: 0.75rem; color: #94a3b8;">Total Assets</span><span style="display: block; font-size: 1.75rem; font-weight: 800; color: #fff;" id="statTotal">0</span></div>
            <div style="border-left: 1px solid #334155; border-right: 1px solid #334155;"><span style="font-size: 0.75rem; color: #94a3b8;">Operational</span><span style="display: block; font-size: 1.75rem; font-weight: 800; color: #34d399;" id="statOperational">100%</span></div>
            <div><span style="font-size: 0.75rem; color: #94a3b8;">Maintenance</span><span style="display: block; font-size: 1.75rem; font-weight: 800; color: #fbbf24;" id="statInService">0</span></div>
        </div>

        <!-- 1. Asset Type Registers Panel -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
            <div style="background-color: #1e293b; border: 1px solid #334155; padding: 1.25rem; border-radius: 0.75rem;">
                <label style="font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 0.5rem; color: #38bdf8;">Select Preset Asset Type</label>
                <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                    <select id="presetTypeDropdown" style="width: 100%; padding: 0.65rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; outline: none; cursor: pointer;"></select>
                    <button onclick="registerPresetAsset()" style="background-color: #2563eb; color: white; padding: 0.65rem; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer;">Register Preset</button>
                </div>
            </div>
            <div style="background-color: #1e293b; border: 1px solid #334155; padding: 1.25rem; border-radius: 0.75rem;">
                <label style="font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 0.5rem; color: #c084fc;">Add New Asset Type</label>
                <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                    <input id="customCategoryInput" type="text" placeholder="Type custom name here (e.g., Server)..." style="width: 100%; padding: 0.65rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; outline: none; box-sizing: border-box;">
                    <button onclick="registerCustomAsset()" style="background-color: #a855f7; color: white; padding: 0.65rem; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer;">Add</button>
                </div>
            </div>
        </div>

        <!-- 2. Dynamic Configuration Form -->
        <div id="allocationFormBox" style="display: none; background-color: #1e293b; border: 1px solid #334155; padding: 1.25rem; border-radius: 0.75rem;">
            <div id="formTitleText" style="font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; margin-bottom: 1rem; color: #38bdf8;">Configure Specifications</div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; margin-bottom: 1rem;">
                <div><label style="font-size: 0.75rem; color: #94a3b8;">Brand Name</label><input id="assetBrand" type="text" style="width: 100%; padding: 0.65rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.4rem; outline: none;"></div>
                <div><label style="font-size: 0.75rem; color: #94a3b8;">Model No.</label><input id="assetModel" type="text" style="width: 100%; padding: 0.65rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.4rem; outline: none;"></div>
                <div><label style="font-size: 0.75rem; color: #94a3b8;">Serial Number</label><input id="assetSerial" type="text" style="width: 100%; padding: 0.65rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.4rem; outline: none;"></div>
                <div><label style="font-size: 0.75rem; color: #94a3b8;">User Name</label><input id="assetUser" type="text" style="width: 100%; padding: 0.65rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.4rem; outline: none;"></div>
                <div><label style="font-size: 0.75rem; color: #94a3b8;">Location</label><input id="assetLocation" type="text" style="width: 100%; padding: 0.65rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.4rem; outline: none;"></div>
            </div>
            
            <!-- Internals specs (Laptop / Desktop only) -->
            <div id="internalSpecsWrapper" style="display: none; margin-top: 1rem; padding: 1rem; background-color: #0f172a; border-radius: 0.5rem; border: 1px solid #334155;">
                <div style="font-size: 0.85rem; color: #c084fc; font-weight: 700; margin-bottom: 0.5rem;">PC/LAPTOP INTERNAL SPECIFICATIONS</div>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.5rem;">
                    <input id="specCPU" type="text" placeholder="Processor CPU" style="padding:0.5rem; background-color:#1e293b; border:1px solid #334155; color:#fff; border-radius:0.3rem;">
                    <input id="specMobo" type="text" placeholder="Motherboard" style="padding:0.5rem; background-color:#1e293b; border:1px solid #334155; color:#fff; border-radius:0.3rem;">
                    <input id="specRAM" type="text" placeholder="RAM size" style="padding:0.5rem; background-color:#1e293b; border:1px solid #334155; color:#fff; border-radius:0.3rem;">
                    <input id="specSSD" type="text" placeholder="SSD Storage" style="padding:0.5rem; background-color:#1e293b; border:1px solid #334155; color:#fff; border-radius:0.3rem;">
                    <input id="specHDD" type="text" placeholder="HDD Storage" style="padding:0.5rem; background-color:#1e293b; border:1px solid #334155; color:#fff; border-radius:0.3rem;">
                    <input id="specPSU" type="text" placeholder="Power Supply" style="padding:0.5rem; background-color:#1e293b; border:1px solid #334155; color:#fff; border-radius:0.3rem;">
                </div>
            </div>
            <button onclick="commitAssetDataToServer()" style="width: 100%; background-color: #059669; color: white; padding: 0.75rem; border: none; border-radius: 0.5rem; font-weight: 700; cursor: pointer; margin-top: 1rem;">Commit Specifications to Live Vault</button>
        </div>

        <!-- 3. Table Log view Logs -->
        <div style="background-color: #1e293b; border: 1px solid #334155; padding: 1.25rem; border-radius: 0.75rem;">
            <div style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem;">Active Infrastructure Logs</div>
            <div style="overflow-x: auto; border: 1px solid #334155; border-radius: 0.5rem;">
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem;">
                    <thead>
                        <tr style="background-color: #0f172a; color: #94a3b8; border-bottom: 1px solid #334155;">
                            <th style="padding: 0.75rem;">Asset Profile</th><th style="padding: 0.75rem;">Category</th><th style="padding: 0.75rem;">Configurations</th><th style="padding: 0.75rem;">Custodian</th><th style="padding: 0.75rem; text-align: center;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="assetTableBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Complete Repaired JavaScript Block (100% Closed) -->
    <script>
        let categories = ["Laptop", "Desktop", "Printer", "Scanner", "Tab", "Monitor", "UPS", "Router"];
        let assets = JSON.parse(localStorage.getItem('a_list_clean')) || [];
        let globalSelectedType = "Laptop";

        function syncDropdownOptions() {
            document.getElementById('presetTypeDropdown').innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        function setupWorkspaceForm(targetType) {
            globalSelectedType = targetType;
            document.getElementById('formTitleText').innerText = "Configure Specifications for: " + globalSelectedType;
            document.getElementById('allocationFormBox').style.display = "block";
            const panel = document.getElementById('internalSpecsWrapper');
            const norm = globalSelectedType.toLowerCase();
            panel.style.display = (norm === "laptop" || norm === "desktop") ? "block" : "none";
        }

        function registerPresetAsset() {
            const dropdown = document.getElementById('presetTypeDropdown').value;
            if(dropdown) setupWorkspaceForm(dropdown);
        }

        function registerCustomAsset() {
