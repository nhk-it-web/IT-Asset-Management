<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Asset Management System</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:2rem 1rem}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:1.25rem}
.card{background:#1e293b;border:1px solid #334155;border-radius:.75rem;padding:1.1rem}
.fld{padding:.6rem;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:.5rem;font-size:.85rem;outline:none;width:100%;color-scheme:dark}
.fld:focus{border-color:#38bdf8}
.lbl{display:block;font-size:.75rem;color:#94a3b8;margin-bottom:.3rem}
.btn{border:0;border-radius:.45rem;padding:.45rem .75rem;cursor:pointer;color:#fff;background:#334155;font-size:.8rem;margin-left:.25rem}
.b-blue{background:#2563eb}.b-vio{background:#7c3aed}.b-red{background:#7f1d1d}.b-pur{background:#9333ea}
.big{width:100%;padding:.75rem;font-weight:600;font-size:.9rem;margin:0;border-radius:.5rem}
.grid{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;color:#94a3b8;padding:.7rem .8rem;border-bottom:1px solid #334155}
td{padding:.7rem .8rem;border-bottom:1px solid #334155;vertical-align:top}
.sc{overflow-x:auto}
.mut{color:#94a3b8;font-size:.75rem}
.tbtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:.9rem 1.1rem;border-radius:.75rem;font-size:1rem;font-weight:600;cursor:pointer}
.tbtn.open{border-color:#38bdf8;border-radius:.75rem .75rem 0 0}
.cnt{margin-left:.5rem;font-size:.75rem;padding:.15rem .55rem;border-radius:999px;background:#0f172a;color:#38bdf8}
.tbl{background:#1e293b;border:1px solid #38bdf8;border-top:0;border-radius:0 0 .75rem .75rem}
.st{border:1px solid;border-radius:999px;padding:.3rem .5rem;font-size:.78rem;font-weight:600;cursor:pointer;outline:none;color-scheme:dark}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;align-items:center;justify-content:center;padding:1rem}
#mbody{background:#1e293b;border:1px solid #38bdf8;border-radius:.75rem;padding:1.25rem;width:100%;max-width:780px;max-height:88vh;overflow:auto}
#msg{display:none;background:#7f1d1d;border:1px solid #f87171;border-radius:.6rem;padding:.8rem 1rem;font-size:.85rem}
h1{font-size:2.3rem;font-weight:800;margin:0;background:linear-gradient(to right,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
    <div style="text-align:center;border-bottom:1px solid #1e293b;padding-bottom:1.25rem"><h1>IT Asset Management</h1></div>
    <div id="msg"></div>

    <div id="stats" class="card" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1rem;text-align:center"></div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
        <div class="card">
            <label class="lbl" style="font-size:.9rem;font-weight:600;color:#34d399">Select Company</label>
            <select id="company" class="fld" style="cursor:pointer"></select>
        </div>
        <div class="card">
            <label class="lbl" style="font-size:.9rem;font-weight:600;color:#fbbf24">Add New Company</label>
            <div style="display:flex;gap:.6rem"><input id="newCompany" class="fld" placeholder="e.g. Sunrise"><button id="addCompany" class="btn b-pur" style="padding:.6rem 1rem">Add</button></div>
        </div>
    </div>

    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
        <div class="card">
            <label class="lbl" style="font-size:.9rem;font-weight:600;color:#38bdf8">Select Preset Asset Type</label>
            <select id="preset" class="fld" style="cursor:pointer"></select>
        </div>
        <div class="card">
            <label class="lbl" style="font-size:.9rem;font-weight:600;color:#c084fc">Add New Asset Type</label>
            <div style="display:flex;gap:.6rem"><input id="newType" class="fld" placeholder="e.g. Projector"><button id="addType" class="btn b-pur" style="padding:.6rem 1rem">Add</button></div>
        </div>
    </div>

    <div id="cfgPanel" class="card" style="display:none;border-color:#38bdf8">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem"><h2 id="cfgTitle" style="margin:0;font-size:1.1rem;color:#38bdf8">Configuration</h2><span id="nextId" class="cnt" style="margin:0;font-size:.85rem;padding:.3rem .8rem"></span></div>
        <div class="grid" style="margin-bottom:1rem">
            <div><label class="lbl">Asset Name</label><input id="aName" class="fld" placeholder="e.g. Dell Latitude 01"></div>
            <div><label class="lbl">Assigned To (Person)</label><input id="aHolder" class="fld" placeholder="e.g. Rahim"></div>
            <div><label class="lbl">Department</label><input id="aDept" class="fld" list="deptList" placeholder="e.g. Accounts"></div>
            <div><label class="lbl">Assigned Date</label><input id="aDate" type="date" class="fld"></div>
            <div><label class="lbl">Status</label><select id="aStatus" class="fld" style="cursor:pointer"></select></div>
            <datalist id="deptList"></datalist>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem"><span class="mut">Details</span><button id="addField" class="btn">+ Add Field</button></div>
        <div class="sc"><table><thead><tr><th style="width:35%">Field</th><th>Value</th><th style="width:40px"></th></tr></thead><tbody id="cfgBody"></tbody></table></div>
        <button id="regBtn" class="btn b-blue big" style="margin-top:1rem">Register Asset</button>
    </div>

    <div class="card" style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center">
        <input id="fName" class="fld" placeholder="Filter by Name / Person..." style="flex:1;min-width:160px">
        <select id="fCompany" class="fld" style="flex:1;min-width:140px;cursor:pointer"></select>
        <select id="fType" class="fld" style="flex:1;min-width:140px;cursor:pointer"></select>
        <select id="fDept" class="fld" style="flex:1;min-width:140px;cursor:pointer"></select>
        <select id="fStatus" class="fld" style="flex:1;min-width:140px;cursor:pointer"></select>
        <button id="expAll" class="btn">Expand all</button><button id="colAll" class="btn">Collapse all</button>
    </div>

    <div id="typeList" style="display:flex;flex-direction:column;gap:.7rem"></div>

    <div class="card" style="display:flex;gap:.6rem;flex-wrap:wrap;align-items:center">
        <span class="mut" style="flex:1;min-width:200px">Backup: পুরো তালিকা ফাইল হিসেবে নামিয়ে রাখুন</span>
        <button id="csvBtn" class="btn b-blue">Download Excel (CSV)</button>
        <button id="jsonBtn" class="btn">Download JSON</button>
    </div>
</div>

<div id="modal"><div id="mbody"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== এই দুটো জায়গায় আপনার Supabase এর Project URL ও anon public key বসান ===== */
const SUPABASE_URL = 'https://ppefbgotnaeozooxpluc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_83W8r7bQykLMM3NyocV-Jg_gy08NEcw';
/* ============================================================================== */

const PRESET = {
    'Laptop':['Brand','Model','CPU','RAM','Storage','Serial No.'],
    'Desktop PC':['Brand','Model','CPU','RAM','Storage','Serial No.'],
    'Monitor':['Brand','Model','Size','Resolution','Serial No.'],
    'Printer':['Brand','Model','Type (Laser/Inkjet)','IP Address','Serial No.'],
    'Router':['Brand','Model','IP Address','MAC Address','Firmware','Location'],
    'Server':['Brand','Model','CPU','RAM','Storage','OS','IP Address','Location'],
    'Smartphone':['Brand','Model','OS','Storage','IMEI'],
    'Keyboard':['Brand','Model','Connection (USB/Wireless)']
};
const DEFAULT_FIELDS = ['Brand','Model','Serial No.'];
const STATUSES = ['Running','In Hand','Servicing','Defect'];
const SC = {'Running':'#34d399','In Hand':'#38bdf8','Servicing':'#fbbf24','Defect':'#f87171'};

const PRESET_COMPANIES = ['Arabi', 'Novel', 'Bengal', 'AST', 'Rosevally'];
let companies = [], types = Object.keys(PRESET), assets = [], open = {}, cfg = [], modal = null, sb = null, timer;
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const attr = s => esc(s).replace(/"/g, '&quot;');

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const utc = s => { const p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); };
const daysBetween = (a, b) => Math.round((utc(b) - utc(a)) / 86400000);
const fmt = s => { const p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
const dayL = n => n + (n === 1 ? ' day' : ' days');
const cur = a => a.history[a.history.length - 1];
const find = id => assets.find(a => a.id === id);

function msg(t) { $('msg').style.display = t ? 'block' : 'none'; $('msg').textContent = t || ''; }
function need() {
    if (!sb) { alert('আগে ফাইলের শুরুতে Supabase এর Project URL ও anon key বসান।'); return false; }
    return true;
}

/* ---------- Load from database ---------- */
async function loadAll() {
    if (!sb) return;
    const [a, t, c] = await Promise.all([
        sb.from('assets').select('*').order('id'),
        sb.from('asset_types').select('name'),
        sb.from('companies').select('name,prefix')
    ]);
    if (a.error) { msg('ডেটা লোড করা যায়নি: ' + a.error.message); return; }
    assets = a.data.map(x => ({
        ...x,
        company: x.company || 'AST',
        code: x.code || ('AST-' + String(x.id).padStart(3, '0')),
        config: x.config || [],
        history: x.history && x.history.length ? x.history : [{ holder: x.holder, dept: x.dept, from: today(), to: null, note: 'Initial assignment' }]
    }));
    (t.data || []).forEach(r => { if (!types.includes(r.name)) types.push(r.name); });
    (c.data || []).forEach(r => { if (!companies.some(x => x.name.toLowerCase() === r.name.toLowerCase())) companies.push({ name: r.name, prefix: r.prefix }); });
    assets.forEach(x => { if (!companies.some(k => k.name === x.company)) companies.push({ name: x.company, prefix: makePrefix(x.company) }); });
    assets.forEach(x => { if (!types.includes(x.type)) types.push(x.type); });
    msg('');
    renderAll();
}
const schedule = () => { clearTimeout(timer); timer = setTimeout(loadAll, 300); };

/* ---------- Config panel ---------- */
function fillPreset(sel) {
    $('preset').innerHTML = '<option value="">-- Select asset type --</option>' + types.map(t => `<option value="${attr(t)}">${esc(t)}</option>`).join('');
    $('preset').value = sel || '';
}
function loadCfg(type) {
    if (!type) { $('cfgPanel').style.display = 'none'; cfg = []; return; }
    if (!$('company').value) { alert('প্রথমে Company বাছুন।'); fillPreset(''); return; }
    cfg = (PRESET[type] || DEFAULT_FIELDS).map(k => ({ k, v: '' }));
    refreshHead();
    $('aDate').value = today(); $('aDate').max = today(); $('aStatus').value = 'Running';
    drawCfg();
    $('cfgPanel').style.display = 'block';
}
function drawCfg() {
    $('cfgBody').innerHTML = cfg.map((r, i) => `<tr>
        <td><input class="fld" data-i="${i}" data-p="k" value="${attr(r.k)}"></td>
        <td><input class="fld" data-i="${i}" data-p="v" value="${attr(r.v)}" placeholder="Write value..."></td>
        <td style="text-align:center"><button data-rm="${i}" style="background:none;border:0;color:#f87171;font-size:1.1rem;cursor:pointer">&times;</button></td></tr>`).join('');
}
$('cfgBody').addEventListener('input', e => { if (e.target.dataset.i !== undefined) cfg[e.target.dataset.i][e.target.dataset.p] = e.target.value; });
$('cfgBody').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { cfg.splice(+b.dataset.rm, 1); drawCfg(); } });
$('addField').onclick = () => { cfg.push({ k: '', v: '' }); drawCfg(); const l = $('cfgBody').querySelectorAll('[data-p="k"]'); l[l.length - 1].focus(); };
$('preset').onchange = () => loadCfg($('preset').value);

async function addType() {
    const name = $('newType').value.trim();
    if (!name) return;
    let m = types.find(t => t.toLowerCase() === name.toLowerCase());
    if (!m) {
        if (!need()) return;
        const { error } = await sb.from('asset_types').upsert({ name });
        if (error) return alert('সেভ হয়নি: ' + error.message);
        types.push(name); m = name;
    }
    fillPreset(m); loadCfg(m); fillFilters(); renderList();
    $('newType').value = '';
}
$('addType').onclick = addType;
$('newType').onkeydown = e => { if (e.key === 'Enter') addType(); };

/* ---------- Company ---------- */
function prefixOf(c) { const x = companies.find(k => k.name === c); return x ? x.prefix : 'AST'; }
function makePrefix(name) {
    const L = name.replace(/[^A-Za-z0-9]/g, '').toUpperCase() || 'CMP';
    const used = companies.map(c => c.prefix);
    for (let n = Math.min(3, L.length); n <= L.length; n++) { if (!used.includes(L.slice(0, n))) return L.slice(0, n); }
    let i = 2; while (used.includes(L + i)) i++;
    return L + i;
}
function nextCode(company) {
    const p = prefixOf(company); let max = 0;
    assets.forEach(a => {
        if (a.code && a.code.startsWith(p + '-')) { const n = parseInt(a.code.slice(p.length + 1), 10); if (n > max) max = n; }
    });
    return p + '-' + String(max + 1).padStart(3, '0');
}
function fillCompany(sel) {
    const v = sel !== undefined ? sel : $('company').value;
    $('company').innerHTML = '<option value="">-- Select company --</option>' + companies.map(c => `<option value="${attr(c.name)}">${esc(c.name)} (${esc(c.prefix)})</option>`).join('');
    $('company').value = companies.some(c => c.name === v) ? v : '';
}
function refreshHead() {
    const t = $('preset').value, c = $('company').value;
    if (t) $('cfgTitle').textContent = 'Configuration - ' + t + ' (' + c + ')';
    $('nextId').textContent = c ? 'Next ID: ' + nextCode(c) : '';
}
$('company').onchange = () => {
    if (!$('company').value) { fillPreset(''); loadCfg(''); }
    refreshHead();
};
async function addCompany() {
    const name = $('newCompany').value.trim();
    if (!name) return;
    let m = companies.find(c => c.name.toLowerCase() === name.toLowerCase());
    if (!m) {
        if (!need()) return;
        m = { name, prefix: makePrefix(name) };
        const { error } = await sb.from('companies').upsert(m);
        if (error) return alert('সেভ হয়নি: ' + error.message);
        companies.push(m);
    }
    fillCompany(m.name); fillFilters(); refreshHead();
    $('newCompany').value = '';
}
$('addCompany').onclick = addCompany;
$('newCompany').onkeydown = e => { if (e.key === 'Enter') addCompany(); };

/* ---------- Register ---------- */
$('regBtn').onclick = async () => {
    const type = $('preset').value, name = $('aName').value.trim();
    if (!type) return;
    if (!name) { alert('অ্যাসেটের Name লিখুন।'); $('aName').focus(); return; }
    if (!need()) return;
    const holder = $('aHolder').value.trim() || 'Unassigned';
    const dept = $('aDept').value.trim() || 'Unassigned';
    const from = $('aDate').value || today();
    const company = $('company').value;
    if (!company) return alert('প্রথমে Company বাছুন।');
    const row = {
        company, type, name, holder, dept, status: $('aStatus').value || 'Running',
        config: cfg.filter(r => r.k.trim() && r.v.trim()).map(r => ({ k: r.k.trim(), v: r.v.trim() })),
        history: [{ holder, dept, from, to: null, note: 'Initial assignment' }]
    };
    let error;
    for (let i = 0; i < 4; i++) {
        ({ error } = await sb.from('assets').insert({ ...row, code: nextCode(company) }));
        if (!error || error.code !== '23505') break;
        await loadAll();
    }
    if (error) return alert('সেভ হয়নি: ' + error.message);
    open[type] = true;
    ['aName', 'aHolder', 'aDept'].forEach(i => $(i).value = '');
    fillPreset(''); loadCfg('');
    loadAll();
};

/* ---------- Filters ---------- */
function fillSel(id, label, items) {
    const v = $(id).value;
    $(id).innerHTML = `<option value="">${label}</option>` + items.map(x => `<option value="${attr(x)}">${esc(x)}</option>`).join('');
    $(id).value = items.includes(v) ? v : '';
}
function fillFilters() {
    const depts = [...new Set(assets.map(a => a.dept))].sort();
    fillSel('fCompany', 'All Companies', companies.map(c => c.name));
    fillSel('fType', 'All Types', types);
    fillSel('fDept', 'All Departments', depts);
    fillSel('fStatus', 'All Status', STATUSES);
    $('deptList').innerHTML = depts.map(d => `<option value="${attr(d)}">`).join('');
}
['fName'].forEach(i => $(i).oninput = renderList);
['fCompany', 'fDept', 'fStatus'].forEach(i => $(i).onchange = renderList);
$('fType').onchange = () => { if ($('fType').value) open[$('fType').value] = true; renderList(); };
$('expAll').onclick = () => { types.forEach(t => open[t] = true); renderList(); };
$('colAll').onclick = () => { open = {}; renderList(); };

/* ---------- List ---------- */
function renderList() {
    const q = $('fName').value.trim().toLowerCase(), d = $('fDept').value, ft = $('fType').value, fs = $('fStatus').value, fc = $('fCompany').value;
    $('typeList').innerHTML = types.map((t, ti) => {
        if (ft && t !== ft) return '';
        const list = assets.filter(a => a.type === t &&
            (!q || a.name.toLowerCase().includes(q) || a.holder.toLowerCase().includes(q)) &&
            (!d || a.dept === d) && (!fs || a.status === fs) && (!fc || a.company === fc));
        const o = !!open[t];
        const head = `<button class="tbtn${o ? ' open' : ''}" data-t="${ti}"><span>${esc(t)}<span class="cnt">${list.length}</span></span><span class="mut">${o ? '▾' : '▸'}</span></button>`;
        if (!o) return `<div>${head}</div>`;
        const rows = list.length ? list.map(row).join('') : '<tr><td colspan="7" class="mut" style="text-align:center;padding:1.2rem">No assets found.</td></tr>';
        return `<div>${head}<div class="tbl sc"><table><thead><tr><th>ID</th><th>Name</th><th>Assigned To</th><th>Department</th><th>Configuration</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    }).join('');
}

function row(a) {
    const c = cur(a), col = SC[a.status] || '#94a3b8';
    const cf = a.config.length ? a.config.map(x => `<div style="font-size:.78rem;line-height:1.5"><span class="mut">${esc(x.k)}:</span> ${esc(x.v)}</div>`).join('') : '<span class="mut">-</span>';
    return `<tr>
        <td class="mut">${esc(a.code)}</td>
        <td><b>${esc(a.name)}</b><div class="mut">${esc(a.company)}</div></td>
        <td><b>${esc(a.holder)}</b><div class="mut">since ${fmt(c.from)} (${dayL(daysBetween(c.from, today()))})</div></td>
        <td>${esc(a.dept)}</td>
        <td>${cf}</td>
        <td><select class="st" data-s="${a.id}" style="background:${col}22;color:${col};border-color:${col}">${STATUSES.map(s => `<option value="${attr(s)}"${s === a.status ? ' selected' : ''}>${esc(s)}</option>`).join('')}</select></td>
        <td style="text-align:right;white-space:nowrap">
            <button class="btn b-blue" data-a="tr" data-id="${a.id}">Transfer</button>
            <button class="btn b-vio" data-a="hi" data-id="${a.id}">History (${a.history.length})</button>
            <button class="btn b-red" data-a="del" data-id="${a.id}">Delete</button></td></tr>`;
}

$('typeList').addEventListener('change', async e => {
    const s = e.target.closest('[data-s]');
    if (!s || !need()) return;
    const { error } = await sb.from('assets').update({ status: s.value }).eq('id', +s.dataset.s);
    if (error) alert('সেভ হয়নি: ' + error.message);
    loadAll();
});
$('typeList').addEventListener('click', async e => {
    const t = e.target.closest('[data-t]');
    if (t) { const n = types[+t.dataset.t]; open[n] = !open[n]; return renderList(); }
    const b = e.target.closest('[data-a]');
    if (!b) return;
    const id = +b.dataset.id;
    if (b.dataset.a === 'tr') return openTransfer(id);
    if (b.dataset.a === 'hi') return openHistory(id);
    if (!confirm('এই অ্যাসেটটা মুছে ফেলবেন? এর হিস্ট্রিও মুছে যাবে।') || !need()) return;
    const { error } = await sb.from('assets').delete().eq('id', id);
    if (error) alert('মোছা যায়নি: ' + error.message);
    loadAll();
});

/* ---------- Modal ---------- */
const showModal = h => { $('mbody').innerHTML = h; $('modal').style.display = 'flex'; };
const closeModal = () => { $('modal').style.display = 'none'; modal = null; };

function openTransfer(id) {
    const a = find(id), c = cur(a), t = today();
    modal = id;
    showModal(`<h3 style="margin:0 0 .4rem;color:#38bdf8">Transfer - ${esc(a.name)}</h3>
        <p class="mut" style="margin:0 0 1rem;font-size:.85rem">Currently with <b style="color:#e2e8f0">${esc(a.holder)}</b> (${esc(a.dept)}) since ${fmt(c.from)} - ${dayL(daysBetween(c.from, t))}</p>
        <div class="grid">
            <div><label class="lbl">Transfer To (Person)</label><input id="tHolder" class="fld" placeholder="e.g. Karim"></div>
            <div><label class="lbl">Department</label><input id="tDept" class="fld" list="deptList" value="${attr(a.dept)}"></div>
            <div><label class="lbl">Transfer Date</label><input id="tDate" type="date" class="fld" min="${c.from}" max="${t}" value="${t < c.from ? c.from : t}"></div>
            <div><label class="lbl">Note (optional)</label><input id="tNote" class="fld" placeholder="e.g. Role change"></div>
        </div>
        <div style="display:flex;gap:.6rem;margin-top:1.1rem">
            <button id="tOk" class="btn b-blue big" style="flex:1">Confirm Transfer</button>
            <button data-close="1" class="btn big" style="width:auto;padding:.75rem 1.2rem">Cancel</button></div>`);
    $('tHolder').focus();
}

async function doTransfer() {
    const a = find(modal);
    if (!a || !need()) return;
    const c = cur(a), holder = $('tHolder').value.trim(), dept = $('tDept').value.trim() || 'Unassigned', date = $('tDate').value, note = $('tNote').value.trim();
    if (!holder) return alert('কার কাছে ট্রান্সফার করবেন তার নাম লিখুন।');
    if (!date) return alert('ট্রান্সফারের তারিখ দিন।');
    if (date < c.from) return alert('ট্রান্সফারের তারিখ আগের এসাইন তারিখ (' + fmt(c.from) + ') এর আগে হতে পারবে না।');
    if (date > today()) return alert('ভবিষ্যতের তারিখ দেওয়া যাবে না।');
    if (holder.toLowerCase() === a.holder.toLowerCase() && dept.toLowerCase() === a.dept.toLowerCase()) return alert('এই অ্যাসেট আগে থেকেই এই ব্যক্তির কাছে আছে।');
    const history = a.history.map((h, i) => i === a.history.length - 1 ? { ...h, to: date } : h).concat({ holder, dept, from: date, to: null, note });
    const { error } = await sb.from('assets').update({ holder, dept, history }).eq('id', a.id);
    if (error) return alert('সেভ হয়নি: ' + error.message);
    open[a.type] = true;
    closeModal();
    loadAll();
}

function openHistory(id) {
    const a = find(id), t = today();
    let total = 0;
    const rows = a.history.map((h, i) => {
        const days = daysBetween(h.from, h.to || t); total += days;
        return `<tr${h.to ? '' : ' style="background:rgba(52,211,153,.07)"'}><td class="mut">${i + 1}</td><td><b>${esc(h.holder)}</b></td><td>${esc(h.dept)}</td><td>${fmt(h.from)}</td>
            <td>${h.to ? fmt(h.to) : '<b style="color:#34d399">Present</b>'}</td><td><b>${dayL(days)}</b>${h.to ? '' : ' <span class="mut">(so far)</span>'}</td><td class="mut">${h.note ? esc(h.note) : '-'}</td></tr>`;
    }).join('');
    showModal(`<h3 style="margin:0 0 .3rem;color:#38bdf8">History - ${esc(a.name)} (${esc(a.code)})</h3>
        <p class="mut" style="margin:0 0 1rem;font-size:.85rem">Total in use: <b style="color:#e2e8f0">${dayL(total)}</b> &middot; ${a.history.length} record(s)</p>
        <div class="sc"><table><thead><tr><th>#</th><th>Person</th><th>Department</th><th>From</th><th>To</th><th>Days Used</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table></div>
        <button data-close="1" class="btn big" style="margin-top:1.1rem">Close</button>`);
}

$('modal').addEventListener('click', e => {
    if (e.target === $('modal') || e.target.closest('[data-close]')) return closeModal();
    if (e.target.id === 'tOk') doTransfer();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ---------- Stats ---------- */
function stats() {
    $('stats').innerHTML = [['Total Assets', assets.length, '#fff'], ...STATUSES.map(s => [s, assets.filter(a => a.status === s).length, SC[s]])]
        .map(([l, n, c]) => `<div><span class="mut">${l}</span><span style="display:block;font-size:2rem;font-weight:800;color:${c}">${n}</span></div>`).join('');
}

/* ---------- Backup download ---------- */
function saveFile(name, mime, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('csvBtn').onclick = () => {
    const q = v => { v = String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
    const rows = [['ID', 'Company', 'Type', 'Name', 'Assigned To', 'Department', 'Status', 'Since', 'Days', 'Configuration', 'History']]
        .concat(assets.map(a => {
            const c = cur(a);
            return [a.code, a.company, a.type, a.name, a.holder, a.dept, a.status, fmt(c.from), daysBetween(c.from, today()),
                a.config.map(x => x.k + ': ' + x.v).join('; '),
                a.history.map(h => h.holder + ' (' + fmt(h.from) + ' - ' + (h.to ? fmt(h.to) : 'Present') + ')').join(' | ')];
        }));
    saveFile('assets-' + today() + '.csv', 'text/csv;charset=utf-8', '\ufeff' + rows.map(r => r.map(q).join(',')).join('\r\n'));
};
$('jsonBtn').onclick = () => saveFile('assets-backup-' + today() + '.json', 'application/json', JSON.stringify({ types, assets }, null, 2));

/* ---------- Start ---------- */
function renderAll() { fillCompany(); fillFilters(); renderList(); stats(); refreshHead(); }

$('aStatus').innerHTML = STATUSES.map(s => `<option value="${attr(s)}">${esc(s)}</option>`).join('');
PRESET_COMPANIES.forEach(n => companies.push({ name: n, prefix: makePrefix(n) }));
fillPreset(''); renderAll();

if (SUPABASE_URL.startsWith('PASTE') || SUPABASE_KEY.startsWith('PASTE') || !window.supabase) {
    msg('Supabase এর Project URL ও anon key এখনও বসানো হয়নি। ফাইলের <script> অংশের শুরুতে দুটো লাইনে সেগুলো বসান।');
} else {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    sb.channel('rt')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'assets' }, schedule)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'asset_types' }, schedule)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'companies' }, schedule)
        .subscribe();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(); });
    loadAll();
}
</script>
</body>
</html>
