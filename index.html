<!-- JavaScript Logic -->
    <script>
        let categories = ["Laptop", "Desktop", "Printer", "Scanner", "Tab", "Monitor", "UPS", "Router"];
        let assets = [];
        let currentSelectedCategory = "";

        // ১. পেজ লোড হলে ড্রপডাউন অপশনগুলো দেখাবে
        window.addEventListener("DOMContentLoaded", () => {
            populatePresetDropdown();
            updateDashboardCounters();
        });

        // ড্রপডাউন ফিল করার ফাংশন
        function populatePresetDropdown() {
            const dropdown = document.getElementById("presetTypeDropdown");
            dropdown.innerHTML = '<option value="" disabled selected>Select an asset type...</option>';
            categories.forEach(cat => {
                const opt = document.createElement("option");
                opt.value = cat;
                opt.textContent = cat;
                dropdown.appendChild(opt);
            });
        }

        // ২. "Register Preset" বাটনের কাজ
        function registerPresetAsset() {
            const dropdown = document.getElementById("presetTypeDropdown");
            const selected = dropdown.value;
            if (!selected) {
                alert("Please select a preset asset type first.");
                return;
            }
            openAllocationForm(selected);
        }

        // ৩. "Add" (Custom Asset) বাটনের কাজ
        function registerCustomAsset() {
            const input = document.getElementById("customCategoryInput");
            const customCat = input.value.trim();
            if (!customCat) {
                alert("Please enter a custom asset category name.");
                return;
            }
            if (!categories.some(c => c.toLowerCase() === customCat.toLowerCase())) {
                categories.push(customCat);
                populatePresetDropdown();
            }
            openAllocationForm(customCat);
            input.value = "";
        }

        // ৪. কনফিগারেশন ফর্ম ওপেন করার ফাংশন
        function openAllocationForm(category) {
            currentSelectedCategory = category;
            const formBox = document.getElementById("allocationFormBox");
            const titleText = document.getElementById("formTitleText");
            const internalWrapper = document.getElementById("internalSpecsWrapper");

            titleText.textContent = `Configure Specifications (${category})`;
            formBox.style.display = "block";

            // Laptop বা Desktop হলে ইন্টারনাল স্পেক্স ফিল্ড দেখাবে
            const isPC = ["laptop", "desktop"].includes(category.toLowerCase());
            internalWrapper.style.display = isPC ? "block" : "none";

            formBox.scrollIntoView({ behavior: "smooth" });
        }

        // ৫. "Commit Specifications to Live Vault" বাটনের কাজ
        function commitAssetDataToServer() {
            const brand = document.getElementById("assetBrand").value.trim();
            const model = document.getElementById("assetModel").value.trim();
            const serial = document.getElementById("assetSerial").value.trim();
            const user = document.getElementById("assetUser").value.trim();
            const location = document.getElementById("assetLocation").value.trim();

            if (!brand || !model || !serial) {
                alert("Please fill in at least the Brand, Model, and Serial Number.");
                return;
            }

            let specs = [];
            const isPC = ["laptop", "desktop"].includes(currentSelectedCategory.toLowerCase());
            if (isPC) {
                const cpu = document.getElementById("specCPU").value.trim();
                const mobo = document.getElementById("specMobo").value.trim();
                const ram = document.getElementById("specRAM").value.trim();
                const ssd = document.getElementById("specSSD").value.trim();
                const hdd = document.getElementById("specHDD").value.trim();
                const psu = document.getElementById("specPSU").value.trim();

                if (cpu) specs.push(`CPU: ${cpu}`);
                if (mobo) specs.push(`Mobo: ${mobo}`);
                if (ram) specs.push(`RAM: ${ram}`);
                if (ssd) specs.push(`SSD: ${ssd}`);
                if (hdd) specs.push(`HDD: ${hdd}`);
                if (psu) specs.push(`PSU: ${psu}`);
            }

            const newAsset = {
                id: Date.now(),
                category: currentSelectedCategory,
                brand,
                model,
                serial,
                user: user || "Unassigned",
                location: location || "Storage",
                specs: specs.length > 0 ? specs.join(" | ") : "Standard Device"
            };

            assets.push(newAsset);
            renderTable();
            updateDashboardCounters();
            resetForm();
        }

        // ৬. টেবিল ডাটা রেন্ডার করা
        function renderTable() {
            const tbody = document.getElementById("assetTableBody");
            tbody.innerHTML = "";

            if (assets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 1.5rem; color: #64748b;">No assets logged yet.</td></tr>`;
                return;
            }

            assets.forEach(asset => {
                const tr = document.createElement("tr");
                tr.style.borderBottom = "1px solid #334155";
                tr.innerHTML = `
                    <td style="padding: 1rem;"><strong style="color: #fff;">${escapeHtml(asset.brand)} ${escapeHtml(asset.model)}</strong><br><small style="color: #94a3b8;">S/N: ${escapeHtml(asset.serial)}</small></td>
                    <td style="padding: 1rem;"><span style="background: #334155; color: #38bdf8; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 600;">${escapeHtml(asset.category)}</span></td>
                    <td style="padding: 1rem; color: #cbd5e1;">${escapeHtml(asset.specs)}</td>
                    <td style="padding: 1rem;"><strong style="color: #e2e8f0;">${escapeHtml(asset.user)}</strong><br><small style="color: #94a3b8;">${escapeHtml(asset.location)}</small></td>
                    <td style="padding: 1rem; text-align: center;">
                        <button onclick="removeAsset(${asset.id})" style="background: #ef4444; color: white; border: none; padding: 0.4rem 0.75rem; border-radius: 0.375rem; font-size: 0.75rem; font-weight: 600; cursor: pointer;">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ৭. অ্যাসেট ডিলিট করা
        function removeAsset(id) {
            assets = assets.filter(a => a.id !== id);
            renderTable();
            updateDashboardCounters();
        }

        // ৮. ড্যাশবোর্ডের টোটাল কাউন্টার আপডেট করা
        function updateDashboardCounters() {
            document.getElementById("statTotal").textContent = assets.length;
        }

        // ফর্ম রিসেট করার ফাংশন
        function resetForm() {
            document.getElementById("assetBrand").value = "";
            document.getElementById("assetModel").value = "";
            document.getElementById("assetSerial").value = "";
            document.getElementById("assetUser").value = "";
            document.getElementById("assetLocation").value = "";
            document.getElementById("specCPU").value = "";
            document.getElementById("specMobo").value = "";
            document.getElementById("specRAM").value = "";
            document.getElementById("specSSD").value = "";
            document.getElementById("specHDD").value = "";
            document.getElementById("specPSU").value = "";
            document.getElementById("allocationFormBox").style.display = "none";
        }

        // সিকিউরিটির জন্য HTML Escape ফাংশন
        function escapeHtml(str) {
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
