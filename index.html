<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Asset Management Suite</title>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 2rem 1rem; box-sizing: border-box;">

    <div style="max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem;">
        
        <!-- Premium Minimalist Header -->
        <div style="text-align: center; border-bottom: 1px solid #1e293b; padding-bottom: 1.5rem; margin-bottom: 0.5rem;">
            <h1 style="font-size: 2.75rem; font-weight: 800; margin: 0; tracking: -0.03em; background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block;">IT Asset Management</h1>
            <p style="font-size: 0.95rem; color: #94a3b8; margin-top: 0.5rem; tracking: 0.05em; text-transform: uppercase;">Enterprise Hardware Inventory Ledger</p>
        </div>
        
        <!-- Top Operational Counters Grid -->
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); background-color: #1e293b; padding: 1.25rem; border-radius: 1rem; border: 1px solid #334155; text-align: center; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);">
            <div>
                <span style="display: block; font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; font-weight: 600;">Total Assets</span>
                <span style="display: block; font-size: 2.25rem; font-weight: 800; color: #ffffff; margin-top: 0.25rem;" id="statTotal">0</span>
            </div>
            <div style="border-left: 1px solid #334155; border-right: 1px solid #334155;">
                <span style="display: block; font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; font-weight: 600;">Operational</span>
                <span style="display: block; font-size: 2.25rem; font-weight: 800; color: #34d399; margin-top: 0.25rem;" id="statOperational">100%</span>
            </div>
            <div>
                <span style="display: block; font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; font-weight: 600;">Under Maintenance</span>
                <span style="display: block; font-size: 2.25rem; font-weight: 800; color: #fbbf24; margin-top: 0.25rem;" id="statInService">0</span>
            </div>
        </div>

        <!-- Section: Register New Asset Block -->
        <div style="background-color: #1e293b; border: 1px solid #334155; padding: 1.5rem; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);">
            <label style="font-size: 0.9rem; font-weight: 600; color: #ffffff; display: block; margin-bottom: 0.75rem;">Register New Asset Type</label>
            <div style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem;">
                
                <!-- Main Core Dropdown Selection Menu -->
                <select id="presetTypeDropdown" onchange="handleDropdownChange()" style="flex: 1; min-width: 250px; padding: 0.75rem; background-color: #0f172a; border: 1px solid #334155; color: #ffffff; border-radius: 0.5rem; font-size: 0.875rem; outline: none; cursor: pointer;">
                    <option value="Laptop">Laptop</option>
                    <option value="Desktop">Desktop</option>
                    <option value="Printer">Printer</option>
                    <option value="Scanner">Scanner</option>
                    <option value="Tab">Tab</option>
                    <option value="Monitor">Monitor</option>
                    <option value="UPS">UPS</option>
                    <option value="Router">Router</option>
                    <option value="__NEW_ASSET__" style="color: #38bdf8; font-weight: bold;">+ Add New Asset Category...</option>
                </select>

                <!-- Hidden Input Box to inject a completely custom category natively -->
                <input id="customCategoryInput" type="text" placeholder="Type custom asset category name..." style="display: none; flex: 1; min-width: 200px; padding: 0.75rem; background-color: #0f172a; border: 1px solid #334155; color: #ffffff; border-radius: 0.5rem; font-size: 0.875rem; outline: none;">

                <button onclick="openConfigurationForm()" style="background-color: #2563eb; color: white; padding: 0.75rem 2rem; border: none; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 600; cursor: pointer; height: 44px; transition: background-color 0.2s;">Register</button>
            </div>

            <!-- Dynamic Dynamic Configuration Allocation Grid Table Forms (Opens on Register Click) -->
            <div id="dynamicConfigForm" style="display: none; border-top: 1px solid #334155; padding-top: 1.25rem; margin-top: 1.25rem;">
                <h3 style="font-size: 1.05rem; font-weight: 700; color: #38bdf8; margin-bottom: 1rem;">Configure Specifications for Selected Asset</h3>
                
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.25rem;">
                    <!-- Universal System Standard Fields -->
                    <div><label style="font-size: 0.75rem; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 0.25rem;">Brand Name</label><input id="assetBrand" type="text" placeholder="e.g., HP, Dell, Asus" style="width: 100%; padding: 0.75rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; outline: none; box-sizing: border-box;"></div>
                    <div><label style="font-size: 0.75rem; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 0.25rem;">Model Name/Number</label><input id="assetModel" type="text" placeholder="e.g., Core Elite Book" style="width: 100%; padding: 0.75rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; outline: none; box-sizing: border-box;"></div>
                    <div><label style="font-size: 0.75rem; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 0.25rem;">Serial Key / Tag</label><input id="assetSerial" type="text" placeholder="e.g., S/N-998273" style="width: 100%; padding: 0.75rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; outline: none; box-sizing: border-box;"></div>
                    <div><label style="font-size: 0.75rem; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 0.25rem;">User Custodian Name</label><input id="assetUser" type="text" placeholder="Employee Name" style="width: 100%; padding: 0.75rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; outline: none; box-sizing: border-box;"></div>
                    <div>
                        <label style="font-size: 0.75rem; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 0.25rem;">Office Location Hub</label>
                        <select id="assetLocation" style="width: 100%; padding: 0.75rem; background-color: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; outline: none; cursor: pointer;">
                            <option>Dhaka HQ</option>
                            <option>Chittagong Hub</option>
                            <option>Remote Working</option>
                        </select>
                    </div>
                </div>

                <!-- Custom High-End Hardware Specifications Matrices Group (Only for Laptops and Desktops) -->
                <div id="pcAdvancedSpecsContainer" style="display: none; background-color: #0f172a; border: 1px solid #334155; padding: 1rem; border-radius: 0.75rem; margin-bottom: 1.25rem;">
                    <h4 style="font-size: 0.85rem; text-transform: uppercase; tracking: 0.05em; color: #a855f7; margin-bottom: 0.75rem; font-weight: 700;">System Internals Configuration</h4>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                        <div><label style="font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Processor CPU</label><input id="specCPU" type="text" placeholder="e.g., Core i7 13th Gen" style="width: 100%; padding: 0.65rem; background-color: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; outline: none; box-sizing: border-box; font-size: 0.85rem;"></div>
                        <div><label style="font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">Motherboard</label><input id="specMobo" type="text" placeholder="e.g., ASUS ROG B760" style="width: 100%; padding: 0.65rem; background-color: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; outline: none; box-sizing: border-box; font-size: 0.85rem;"></div>
                        <div><label style="font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">RAM Memory size</label><input id="specRAM" type="text" placeholder="e.g., 16GB DDR5" style="width: 100%; padding: 0.65rem; background-color: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; outline: none; box-sizing: border-box; font-size: 0.85rem;"></div>
                        <div><label style="font-size: 0.75rem; color: #94a3b8; display: block; margin-bottom: 0.25rem;">SSD Drive Storage</label><input id="specSSD" type="text" placeholder="e.g., 512GB NVMe M.2" style="width: 100%; padding: 0.65rem; background-color: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 0.5rem; outline: none; box-sizing: border-box; font-size: 0.85rem;"></div>
